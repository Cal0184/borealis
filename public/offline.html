<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142820">
<title>Sin conexión · Borealis</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F4F7F5; color: #142820; padding: 16px; box-sizing: border-box; }
  .box { max-width: 420px; text-align: center; background: #fff; border: 1px solid #dfe7e2; border-radius: 14px; padding: 28px 22px; }
  h1 { font-size: 20px; margin: 12px 0 8px; }
  p { margin: 0 0 18px; color: #4b5c54; line-height: 1.5; }
  button { font: inherit; background: #142820; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #0e1a15; color: #e8f0ec; } .box { background: #15241d; border-color: #24392f; } p { color: #a9bcb2; } button { background: #10B981; color: #0e1a15; } }
</style>
</head>
<body>
<div class="box">
  <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#142820"/><path d="M12 4 7 11h2.5L6 16h4.5v4h3v-4H18l-3.5-5H17z" fill="#10B981"/></svg>
  <h1>Sin conexión</h1>
  <p>Borealis necesita internet para mostrar tus proyectos. Nada de tu información se guarda en este dispositivo; en cuanto vuelva la conexión, todo estará como lo dejaste.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</div>
</body>
</html>
